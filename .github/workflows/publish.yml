name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.21)'
        required: true
        default: '0.1.21'
      publish_to_github_packages:
        description: 'Also publish to GitHub Packages'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          # Imports the signing key into the runner's GPG keyring. The passphrase
          # is deliberately not passed here - maven-gpg-plugin reads it straight
          # from the MAVEN_GPG_PASSPHRASE env var on the deploy step.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      # setup-java can only write a single <server> entry and we need two.
      # ${env.*} is Maven's own interpolation, resolved when Maven reads the
      # file, so the secrets never land on disk or in the process list.
      - name: Write Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Verify version matches input
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Parent POM version: $POM_VERSION"
          echo "Input version: ${{ github.event.inputs.version }}"
          if [ "$POM_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "Error: Parent POM version does not match input version"
            exit 1
          fi
          if [[ "$POM_VERSION" == *SNAPSHOT ]]; then
            echo "SNAPSHOT versions are not allowed"
            exit 1
          fi

      - name: Build and test all modules
        run: mvn -B clean verify

      # Maven Central goes first: a published Central release is permanent and
      # cannot be deleted or overwritten. If validation rejects the bundle the
      # same version can be retried, but only while nothing has shipped yet.
      - name: Publish SDK to Maven Central
        run: mvn -B deploy -Pcentral -DskipTests
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish SDK to GitHub Packages
        if: ${{ github.event.inputs.publish_to_github_packages == 'true' }}
        run: mvn -B deploy -Pgithub -DskipTests -pl sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: |
            Release ${{ github.event.inputs.version }} of claude-agent-sdk-java

            ## Installation

            ### Maven
            ```xml
            <dependency>
                <groupId>in.vidyalai</groupId>
                <artifactId>claude-agent-sdk-java</artifactId>
                <version>${{ github.event.inputs.version }}</version>
            </dependency>
            ```

            Available from Maven Central - no repository or authentication setup
            required. The artifact is also mirrored to GitHub Packages, which
            does require a personal access token; see the README if you need that.

            ## Examples

            Example code is available in the `examples/` module. See the README for instructions on running examples.
          draft: false
          prerelease: false
